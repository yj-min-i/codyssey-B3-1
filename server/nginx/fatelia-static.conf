# FATELIA — 정적 파일(빌드 결과물) 서빙
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    root /var/www/fatelia;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        # SPA(React/Vite 등) 새로고침 시 404 방지
        try_files $uri $uri/ /index.html;
    }
}
